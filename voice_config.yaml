stt:
  provider: faster-whisper
  online_enabled: false
  warmup_on_startup: false
  groq_model: whisper-large-v3-turbo
  language: auto
  model: large-v3
  model_path: null # Optional local CTranslate2 directory; otherwise use the existing HF cache only.
  vocabulary_hint: ""
  device: cpu
  compute_type: int8
  beam_size: 1
  vad_filter: true
  condition_on_previous_text: false
  temperatures: [0.0]
  no_speech_threshold: 0.6
  min_avg_logprob: -1.0
vad:
  provider: silero
  threshold: 0.5
  min_silence_ms: 700
  min_speech_ms: 300
  max_utterance_s: 30
  preroll_ms: 300
wakeword:
  enabled: false
  model: hey_jarvis
  threshold: 0.5
input:
  mode: always_on
  device: default
  native_sample_rate: true
  target_sample_rate: 16000
  channels: 1
  gain: 1.0
barge_in: false
audio:
  frame_samples: 512
  input_queue_size: 128
  playback_queue_size: 32
  sentence_silence_ms: 150
  fade_ms: 5
  target_peak_dbfs: -1.0
  output_reference_rate: 24000
  aec_stream_delay_ms: 0
logging:
  level: INFO
  file: data/logs/voice.log
  max_bytes: 5242880
  backup_count: 4
tts:
  enabled: true
  provider: piper
  online_enabled: false # Edge requires provider: edge_tts AND explicit online opt-in.
  warmup_on_startup: false
  sample_rate: 22050
  local:
    models:
      en: models/tts/en_US-amy-medium.onnx
      ur: models/tts/ur_PK-aegis_female-medium.onnx
  voices:
    en: en-GB-RyanNeural
    ur: ur-PK-UzmaNeural
  elevenlabs:
    enabled: false
    voice_id: xWRIcE4FuE8s9387uHX3
    model_id: eleven_v4_turbo
brain:
  qalb:
    enabled: true
    mode: hybrid
    server: llama_cpp
    base_url: http://127.0.0.1:8081/v1
    model: Qalb-1.0-8B-Instruct.Q4_K_M.gguf
    model_path: 'C:\Users\Hammad\Desktop\Nexus\models\qalb\Qalb-1.0-8B-Instruct.Q4_K_M.gguf' # Exact user-provided GGUF; never auto-download or substitute.
    chat_template: llama3 # GGUF has Llama tokenizer metadata but no embedded tokenizer.chat_template.
    stop: ["<|eot_id|>", "<|end_of_text|>", "<|start_header_id|>user"]
    context_tokens: 8192
    gpu_layers: 6 # Conservative partial offload for the 2 GB Quadro K620.
    timeout_s: 30
    auto_start: true
    executable: 'C:\Users\Hammad\AppData\Local\Microsoft\WinGet\Packages\ggml.llamacpp_Microsoft.Winget.Source_8wekyb3d8bbwe\llama-server.exe'
    temperature: 0.6
    top_p: 0.9
    repeat_penalty: 1.1
    max_tokens: 400
    stream: true
    system_prompt: >-
      You are JARVIS, a professional personal assistant. Always reply in fluent,
      natural Urdu written in Urdu script only. Never use Hindi/Devanagari or
      Roman Urdu. Keep replies short and conversational because they will be
      spoken aloud. No markdown, lists, emojis, or code. Keep technical English
      terms where natural. Be polite and professional.
