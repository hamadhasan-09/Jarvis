<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#02070d">
<meta name="application-name" content="J.A.R.V.I.S. Nexus">
<title>NEXUS CORE // LIVE</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.4/socket.io.min.js"></script>
<style>
:root {
  --space: #02070d;
  --space-blue: #071725;
  --cyan: #71e6ff;
  --cyan-bright: #d8fbff;
  --cyan-soft: rgba(113, 230, 255, .58);
  --blue: #3ca7d4;
  --amber: #ffbd72;
  --amber-bright: #fff0c8;
  --green: #8cf4bd;
  --danger: #ff8f8f;
  --muted: rgba(190, 224, 235, .66);
  --state-speed: 1;
}

* { box-sizing: border-box; }
html, body { width: 100%; height: 100%; margin: 0; }
body {
  overflow: hidden;
  color: var(--cyan-bright);
  background:
    radial-gradient(ellipse at 50% 48%, rgba(27, 126, 171, .16) 0%, rgba(4, 22, 35, .08) 34%, transparent 64%),
    radial-gradient(circle at 18% 78%, rgba(24, 105, 147, .09), transparent 30%),
    linear-gradient(145deg, #010409 0%, var(--space) 48%, #061421 100%);
  font-family: "Segoe UI", "Trebuchet MS", sans-serif;
  letter-spacing: .08em;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 20;
  opacity: .19;
  background: repeating-linear-gradient(0deg, transparent 0 3px, rgba(175, 238, 255, .035) 4px);
}
body::after {
  content: "";
  position: fixed;
  inset: -35%;
  pointer-events: none;
  z-index: 1;
  opacity: .34;
  background: linear-gradient(112deg, transparent 39%, rgba(137, 231, 255, .045) 50%, transparent 61%);
  transform: rotate(-10deg);
  animation: atmosphericSweep 22s linear infinite;
}
button { font: inherit; color: inherit; }

/* Exact-image mode: the supplied reference is the visual source of truth. */
#referenceVisual {
  position: fixed;
  inset: 0;
  z-index: 0;
  display: block;
  width: 100vw;
  height: 100vh;
  object-fit: contain;
  object-position: center center;
  background: #02070d;
  user-select: none;
  -webkit-user-drag: none;
  transform-origin: center center;
  transition: transform .24s ease-out, filter .24s ease-out;
}
body[data-ui-state="idle"] #referenceVisual {
  animation: idleCoreBreath 4.8s ease-in-out infinite;
}
body[data-ui-state="speaking"] #referenceVisual {
  animation: jarvisCoreExpand 1.3s cubic-bezier(.22, .78, .2, 1) infinite;
  filter: saturate(1.1) brightness(1.05);
}
body.user-speaking #referenceVisual {
  animation: userCoreCompress .52s ease-in-out infinite alternate;
  filter: saturate(1.04) brightness(.98);
}
@keyframes idleCoreBreath {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.004); }
}
@keyframes jarvisCoreExpand {
  0% { transform: scale(1); }
  14% { transform: scale(1.024); }
  50% { transform: scale(1.038); }
  86%, 100% { transform: scale(1.018); }
}
@keyframes userCoreCompress {
  from { transform: scale(1); }
  to { transform: scale(.974); }
}
#sonicWaves {
  position: fixed;
  inset: 0;
  z-index: 2;
  overflow: hidden;
  pointer-events: none;
  visibility: hidden;
  opacity: 0;
  transition: opacity .2s ease;
}
body[data-ui-state="speaking"] #sonicWaves {
  visibility: visible;
  opacity: 1;
}
.sonic-wave {
  position: absolute;
  left: 50%;
  top: 47.2%;
  width: clamp(220px, 23vw, 390px);
  aspect-ratio: 1;
  border: 1px solid rgba(113, 230, 255, .78);
  border-radius: 50%;
  transform: translate(-50%, -50%) scale(.72);
  box-shadow: 0 0 24px rgba(80, 206, 255, .42), inset 0 0 20px rgba(255, 185, 94, .18);
  animation: sonicWaveExpand 1.3s cubic-bezier(.18, .72, .25, 1) infinite;
}
.sonic-wave::after {
  content: "";
  position: absolute;
  inset: 10%;
  border: 1px solid rgba(255, 190, 108, .36);
  border-radius: 50%;
}
.sonic-wave.wave-two {
  width: clamp(310px, 33vw, 540px);
  border-color: rgba(113, 230, 255, .48);
  animation-delay: .42s;
}
.sonic-wave.wave-three {
  width: clamp(410px, 43vw, 700px);
  border-color: rgba(255, 190, 108, .32);
  animation-delay: .84s;
}
@keyframes sonicWaveExpand {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(.72); }
  8% { opacity: .62; transform: translate(-50%, -50%) scale(.79); }
  14% { opacity: .84; transform: translate(-50%, -50%) scale(.84); }
  36% { opacity: .52; transform: translate(-50%, -50%) scale(.92); }
  100% { opacity: 0; transform: translate(-50%, -50%) scale(1.06); }
}
body::before,
body::after { display: none; }
body > #ambientCanvas,
body > .atmosphere,
body > .presence-shell,
body > .utility-strip {
  visibility: hidden;
  pointer-events: none;
}
#micButton {
  position: fixed !important;
  inset: 0 !important;
  z-index: 50 !important;
  width: 100vw !important;
  height: 100vh !important;
  border: 0 !important;
  outline: none !important;
  background: transparent !important;
  opacity: 0 !important;
  visibility: visible !important;
  pointer-events: auto !important;
  cursor: default;
}

#ambientCanvas {
  position: fixed;
  inset: 0;
  z-index: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  opacity: .82;
}

.atmosphere {
  position: fixed;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  background:
    radial-gradient(ellipse at center, transparent 0 39%, rgba(1, 6, 12, .28) 78%, rgba(0, 2, 6, .68) 100%),
    linear-gradient(180deg, rgba(0, 0, 0, .18), transparent 27%, transparent 74%, rgba(0, 0, 0, .28));
}

.presence-shell {
  position: relative;
  z-index: 4;
  width: 100%;
  height: 100%;
  display: grid;
  place-items: center;
  padding: 3vh 4vw 10vh;
}
.presence {
  width: min(100%, 1040px);
  min-height: 0;
  display: grid;
  place-items: center;
  position: relative;
}
.presence::before {
  content: "";
  position: absolute;
  inset: -10% -18% 4%;
  pointer-events: none;
  background:
    radial-gradient(ellipse at 50% 46%, rgba(46, 174, 227, .14), transparent 42%),
    linear-gradient(90deg, transparent 8%, rgba(48, 167, 218, .035) 19%, transparent 32%, transparent 68%, rgba(48, 167, 218, .035) 81%, transparent 92%);
  filter: blur(7px);
  opacity: .8;
}

.core-scene {
  --core-glow: rgba(93, 218, 248, .8);
  position: relative;
  z-index: 2;
  width: min(70vmin, 780px);
  aspect-ratio: 1;
  display: grid;
  place-items: center;
  transform: translateY(0) scale(1);
  transform-style: preserve-3d;
  animation: coreFloat 8.5s ease-in-out infinite;
  transition: transform 1.2s ease, filter 1.2s ease;
  filter: drop-shadow(0 0 26px rgba(46, 176, 218, .16));
}
.core-scene::before {
  content: "";
  position: absolute;
  inset: 8%;
  border-radius: 50%;
  background:
    radial-gradient(circle at 50% 44%, rgba(84, 213, 255, .25) 0%, rgba(22, 131, 192, .16) 36%, rgba(11, 64, 106, .09) 57%, transparent 74%),
    repeating-conic-gradient(from 8deg, transparent 0 21deg, rgba(92, 221, 255, .13) 22deg 22.7deg, transparent 23.7deg 45deg);
  -webkit-mask: radial-gradient(circle, #000 0 66%, transparent 83%);
  mask: radial-gradient(circle, #000 0 66%, transparent 83%);
  filter: blur(1px);
  transform: scale(1.16);
  opacity: .9;
  transition: opacity 1s ease, transform 1s ease;
}
.core-scene::after {
  content: "";
  position: absolute;
  inset: 4%;
  border: 1px solid rgba(105, 225, 255, .24);
  border-radius: 50%;
  box-shadow: 0 0 46px rgba(79, 201, 236, .2), inset 0 0 42px rgba(77, 202, 238, .11);
  pointer-events: none;
}

#coreCanvas {
  position: absolute;
  inset: -19%;
  width: 138%;
  height: 138%;
  z-index: 6;
  pointer-events: none;
  overflow: visible;
}
.axis-beam {
  position: absolute;
  z-index: 3;
  top: -4%;
  left: 50%;
  width: 1px;
  height: 108%;
  transform: translateX(-50%);
  pointer-events: none;
  opacity: .52;
  background: linear-gradient(180deg, transparent, rgba(151, 239, 255, .72) 15%, rgba(255, 194, 110, .46) 45%, rgba(145, 237, 255, .66) 76%, transparent);
  box-shadow: 0 0 7px rgba(123, 229, 255, .75);
}
.pole-ring {
  position: absolute;
  z-index: 4;
  left: 50%;
  width: 18%;
  height: 5.4%;
  transform: translateX(-50%) rotateX(68deg);
  border: 1px solid rgba(149, 239, 255, .78);
  border-radius: 50%;
  box-shadow: 0 0 8px rgba(78, 214, 255, .62), inset 0 0 7px rgba(78, 214, 255, .42);
  opacity: .85;
  pointer-events: none;
}
.pole-ring::after {
  content: "";
  position: absolute;
  inset: 28% 14%;
  border: 1px solid rgba(255, 193, 111, .72);
  border-radius: 50%;
}
.pole-ring.top { top: 2.5%; animation: poleTop 6.5s ease-in-out infinite; }
.pole-ring.bottom { bottom: 2.5%; animation: poleBottom 6.5s ease-in-out infinite reverse; }
.satellite {
  position: absolute;
  z-index: 9;
  width: 9px;
  height: 9px;
  border: 1px solid var(--amber);
  border-radius: 50%;
  background: radial-gradient(circle, #fff4c8 0 16%, var(--amber) 30%, rgba(255, 151, 48, .2) 72%, transparent 73%);
  box-shadow: 0 0 8px var(--amber), 0 0 16px rgba(255, 165, 60, .75);
  pointer-events: none;
}
.satellite::after {
  content: "";
  position: absolute;
  inset: -4px;
  border: 1px solid rgba(255, 198, 117, .38);
  border-radius: 50%;
}
.satellite.one { top: 26%; left: 12%; animation: satelliteOne 8s ease-in-out infinite; }
.satellite.two { top: 39%; right: 8%; animation: satelliteTwo 10s ease-in-out infinite reverse; }
.satellite.three { bottom: 19%; right: 25%; width: 7px; height: 7px; animation: satelliteThree 7s ease-in-out infinite; }
.reflection-floor {
  position: absolute;
  z-index: 1;
  left: 50%;
  top: 73%;
  width: min(63vmin, 710px);
  height: 15%;
  transform: translateX(-50%) perspective(260px) rotateX(66deg);
  border-radius: 50%;
  background:
    radial-gradient(ellipse, rgba(255, 181, 85, .44) 0 1%, rgba(47, 192, 238, .24) 7%, rgba(35, 152, 203, .08) 28%, transparent 68%),
    repeating-radial-gradient(ellipse, transparent 0 12%, rgba(82, 216, 255, .18) 12.5% 12.9%, transparent 13.4% 22%);
  filter: blur(.2px);
  opacity: .62;
  pointer-events: none;
}

.core-ring {
  position: absolute;
  border-radius: 50%;
  border: 1px solid rgba(111, 228, 255, .42);
  transform-style: preserve-3d;
  pointer-events: none;
  transition: opacity .8s ease, border-color .8s ease, filter .8s ease;
}
.core-ring::before,
.core-ring::after {
  content: "";
  position: absolute;
  border-radius: inherit;
  pointer-events: none;
}
.core-ring::before {
  inset: -1px;
  border: inherit;
  border-color: transparent;
  border-top-color: rgba(232, 252, 255, .82);
  border-right-color: rgba(78, 191, 229, .54);
  filter: drop-shadow(0 0 5px rgba(114, 231, 255, .8));
}
.core-ring::after {
  width: 5px;
  height: 5px;
  top: 7%;
  left: 50%;
  background: var(--cyan-bright);
  box-shadow: 0 0 8px var(--cyan), 0 0 15px var(--cyan);
}
.ring-a { inset: 9%; transform: rotateX(68deg) rotateZ(18deg); animation: orbitA 18s linear infinite; }
.ring-b { inset: 15%; transform: rotateX(67deg) rotateZ(-32deg); animation: orbitB 25s linear infinite reverse; border-style: dashed; opacity: .68; }
.ring-c { inset: 21%; transform: rotateY(68deg) rotateZ(23deg); animation: orbitC 15s linear infinite; border-color: rgba(114, 230, 255, .56); }
.ring-d { inset: 28%; transform: rotateX(72deg) rotateZ(73deg); animation: orbitD 12s linear infinite reverse; border-color: rgba(255, 193, 117, .38); }
.ring-e { inset: 35%; transform: rotateY(70deg) rotateZ(-55deg); animation: orbitE 10s linear infinite; border-color: rgba(177, 243, 255, .38); }
.ring-f { inset: 3%; transform: rotateX(72deg) rotateZ(-12deg); animation: orbitF 34s linear infinite reverse; border-style: dotted; opacity: .42; }

.core-geometry {
  position: absolute;
  inset: 7%;
  z-index: 5;
  overflow: visible;
  opacity: .72;
  transform: rotateZ(2deg);
  animation: geometryDrift 28s linear infinite reverse;
  pointer-events: none;
}
.core-geometry circle,
.core-geometry path,
.core-geometry line {
  fill: none;
  stroke: rgba(117, 229, 255, .55);
  stroke-width: .55;
  vector-effect: non-scaling-stroke;
}
.core-geometry .amber-line { stroke: rgba(255, 194, 112, .7); }
.core-geometry .fine { stroke: rgba(210, 249, 255, .32); stroke-width: .35; }

.core-center {
  position: relative;
  z-index: 8;
  width: 28%;
  aspect-ratio: 1;
  border-radius: 50%;
  background:
    repeating-conic-gradient(from 12deg, rgba(255, 233, 165, .28) 0 1deg, transparent 2deg 17deg),
    radial-gradient(circle at 35% 29%, #fffce8 0 5%, #fff0be 12%, #ffc66f 27%, rgba(241, 135, 42, .78) 47%, rgba(147, 70, 25, .42) 62%, transparent 75%),
    radial-gradient(circle, rgba(255, 177, 65, .52), rgba(255, 104, 24, .12) 62%, transparent 74%);
  background-blend-mode: screen, normal, normal;
  box-shadow:
    0 0 12px var(--amber-bright),
    0 0 30px rgba(255, 184, 92, .92),
    0 0 76px rgba(255, 143, 45, .56),
    inset 0 0 20px rgba(255, 255, 226, .96);
  animation: energyBreathe 3.4s ease-in-out infinite;
  transition: filter .8s ease, box-shadow .8s ease, transform .8s ease;
}
.core-center::before {
  content: "";
  position: absolute;
  inset: 8%;
  border-radius: 50%;
  border: 1px solid rgba(255, 238, 184, .75);
  background:
    repeating-conic-gradient(from 32deg, transparent 0 13deg, rgba(255, 240, 186, .44) 14deg 15deg, transparent 17deg 31deg),
    radial-gradient(circle, transparent 0 42%, rgba(255, 216, 126, .25) 43% 45%, transparent 47% 100%);
  box-shadow: 0 0 18px rgba(255, 193, 98, .8), inset 0 0 12px rgba(255, 241, 193, .6);
  animation: innerPulse 2.6s ease-in-out infinite, coreTexture 8s linear infinite;
}
.core-center::after {
  content: "";
  position: absolute;
  inset: 42%;
  border-radius: 50%;
  background: #fffde9;
  box-shadow: 0 0 12px #fff, 0 0 24px var(--amber);
}

.core-hit {
  position: absolute;
  inset: 5%;
  z-index: 12;
  border: 0;
  border-radius: 50%;
  background: transparent;
  cursor: pointer;
  outline: none;
}
.core-hit:focus-visible {
  box-shadow: 0 0 0 2px rgba(255, 204, 129, .75), 0 0 35px rgba(255, 181, 85, .5);
}
.core-hit:hover + .core-center,
.core-scene:has(.core-hit:hover) .core-center {
  filter: brightness(1.18);
  transform: scale(1.045);
}

.presence-copy {
  position: relative;
  z-index: 13;
  width: min(660px, 86vw);
  margin-top: clamp(-25px, -2.4vh, -8px);
  text-align: center;
  pointer-events: none;
  opacity: .78;
}
body[data-ui-state="idle"] .presence-copy { opacity: .58; }
.state-line {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  color: var(--amber);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .34em;
  text-shadow: 0 0 13px rgba(255, 194, 112, .6);
}
.state-beacon {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 9px var(--green);
  animation: beaconPulse 1.8s ease-in-out infinite;
}
.state-detail {
  min-height: 18px;
  margin-top: 7px;
  color: var(--muted);
  font-size: 10px;
  letter-spacing: .09em;
}
.jarvis-speech {
  min-height: 28px;
  max-height: 100px;
  margin-top: 11px;
  overflow: hidden;
  color: rgba(232, 251, 255, .9);
  font-size: clamp(13px, 1.25vw, 16px);
  line-height: 1.45;
  letter-spacing: .04em;
  text-shadow: 0 0 18px rgba(105, 224, 255, .48);
  white-space: pre-wrap;
}
.user-speech {
  min-height: 17px;
  margin-top: 5px;
  color: rgba(137, 249, 191, .82);
  font-family: Consolas, monospace;
  font-size: 10px;
  letter-spacing: .04em;
  opacity: .78;
}
.core-hint {
  margin-top: 12px;
  color: rgba(171, 211, 223, .48);
  font-size: 9px;
  letter-spacing: .2em;
}

.utility-strip {
  position: fixed;
  z-index: 10;
  left: 50%;
  bottom: 3.5vh;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 18px;
  max-width: 90vw;
  color: rgba(166, 215, 228, .58);
  font-family: Consolas, monospace;
  font-size: 9px;
  letter-spacing: .16em;
  white-space: nowrap;
  opacity: .78;
}
.utility-strip::before {
  content: "";
  position: absolute;
  left: 50%;
  bottom: -10px;
  width: min(300px, 55vw);
  height: 1px;
  transform: translateX(-50%);
  background: linear-gradient(90deg, transparent, rgba(111, 227, 255, .38), transparent);
}
.utility-connection { display: inline-flex; align-items: center; gap: 7px; color: var(--green); }
.utility-beacon { width: 5px; height: 5px; border-radius: 50%; background: currentColor; box-shadow: 0 0 8px currentColor; }
#voiceModule { color: var(--amber); }
#taskState { color: var(--cyan); }

.runtime-data { display: none !important; }
.sr-only {
  position: absolute !important;
  width: 1px !important;
  height: 1px !important;
  padding: 0 !important;
  margin: -1px !important;
  overflow: hidden !important;
  clip: rect(0, 0, 0, 0) !important;
  white-space: nowrap !important;
  border: 0 !important;
}

/* State choreography: the core is the interface. */
.core-scene[data-state="listening"] { --state-speed: 1.45; filter: drop-shadow(0 0 34px rgba(79, 216, 255, .32)); }
.core-scene[data-state="listening"] .core-ring { border-color: rgba(133, 238, 255, .72); }
.core-scene[data-state="listening"] .core-center { box-shadow: 0 0 16px var(--amber-bright), 0 0 45px rgba(255, 191, 92, 1), 0 0 96px rgba(255, 143, 45, .68), inset 0 0 23px #fff; }
.core-scene[data-state="thinking"] { --state-speed: 2.15; transform: scale(1.035); filter: drop-shadow(0 0 42px rgba(71, 201, 246, .44)); }
.core-scene[data-state="thinking"] .core-ring { border-color: rgba(128, 239, 255, .76); }
.core-scene[data-state="thinking"] .core-center { filter: brightness(1.2); }
.core-scene[data-state="speaking"] { --state-speed: 1.3; filter: drop-shadow(0 0 38px rgba(255, 184, 92, .32)); }
.core-scene[data-state="speaking"] .core-center { animation-duration: 1.25s; transform: scale(1.075); }
.core-scene[data-state="speaking"]::before { transform: scale(1.28); opacity: .86; }
.core-scene[data-state="executing"] { --state-speed: 2.65; transform: scale(1.045); filter: drop-shadow(0 0 48px rgba(255, 186, 91, .3)); }
.core-scene[data-state="executing"] .core-ring { border-color: rgba(255, 197, 119, .66); }
.core-scene[data-state="error"] { --state-speed: .25; filter: drop-shadow(0 0 28px rgba(255, 108, 108, .4)); }
.core-scene[data-state="error"] .core-center { filter: saturate(1.18) brightness(.96); box-shadow: 0 0 14px var(--amber-bright), 0 0 38px rgba(255, 184, 92, .86), 0 0 78px rgba(255, 94, 94, .35), inset 0 0 20px rgba(255, 255, 226, .9); }
body[data-ui-state="error"] .state-line { color: var(--danger); text-shadow: 0 0 13px rgba(255, 116, 116, .65); }
body[data-ui-state="error"] .state-beacon { background: var(--danger); box-shadow: 0 0 9px var(--danger); }

@keyframes coreFloat { 0%, 100% { transform: translateY(-5px); } 50% { transform: translateY(8px); } }
@keyframes energyBreathe { 0%, 100% { transform: scale(.96); filter: brightness(.94); } 50% { transform: scale(1.07); filter: brightness(1.22); } }
@keyframes innerPulse { 0%, 100% { opacity: .48; transform: scale(.94); } 50% { opacity: 1; transform: scale(1.06); } }
@keyframes coreTexture { to { rotate: 360deg; } }
@keyframes beaconPulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .42; transform: scale(.7); } }
@keyframes atmosphericSweep { from { translate: -14% 0; } to { translate: 24% 0; } }
@keyframes orbitA { to { transform: rotateX(68deg) rotateZ(378deg); } }
@keyframes orbitB { to { transform: rotateX(67deg) rotateZ(-392deg); } }
@keyframes orbitC { to { transform: rotateY(68deg) rotateZ(383deg); } }
@keyframes orbitD { to { transform: rotateX(72deg) rotateZ(-287deg); } }
@keyframes orbitE { to { transform: rotateY(70deg) rotateZ(305deg); } }
@keyframes orbitF { to { transform: rotateX(72deg) rotateZ(-372deg); } }
@keyframes geometryDrift { to { transform: rotateZ(362deg) scale(1.02); } }
@keyframes poleTop { 0%, 100% { transform: translateX(-50%) rotateX(68deg) scaleX(.82); opacity: .48; } 50% { transform: translateX(-50%) rotateX(68deg) scaleX(1.1); opacity: .94; } }
@keyframes poleBottom { 0%, 100% { transform: translateX(-50%) rotateX(68deg) scaleX(1.04); opacity: .82; } 50% { transform: translateX(-50%) rotateX(68deg) scaleX(.72); opacity: .44; } }
@keyframes satelliteOne { 0%, 100% { transform: translate(0, 0) scale(.82); } 50% { transform: translate(18px, -9px) scale(1.12); } }
@keyframes satelliteTwo { 0%, 100% { transform: translate(0, 0) scale(.72); } 50% { transform: translate(-15px, 13px) scale(1.1); } }
@keyframes satelliteThree { 0%, 100% { transform: translate(0, 0); opacity: .52; } 50% { transform: translate(12px, -8px); opacity: 1; } }

@media (max-width: 720px) {
  .presence-shell { padding: 4vh 3vw 14vh; }
  .core-scene { width: min(78vmin, 570px); }
  .presence-copy { margin-top: -18px; }
  .utility-strip { gap: 10px; font-size: 8px; letter-spacing: .1em; }
  .utility-strip > span:nth-child(n+4) { display: none; }
  .core-hint { letter-spacing: .12em; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
}
</style>
</head>

  <span id="modelLabel"></span><span id="retrievalStatus"></span><span id="memoryStats"></span>

  <i id="cpuMeter"></i><i id="ramMeter"></i>
  <ul id="historyList"></ul><ul id="noticeList"></ul>

<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const socket = io({ reconnection: true, reconnectionAttempts: Infinity, reconnectionDelay: 500, timeout: 10000 });
  const synth = ('speechSynthesis' in window) ? window.speechSynthesis : null;
  const ambientCanvas = $('ambientCanvas');
  const coreCanvas = $('coreCanvas');
  let speechVoices = [];
  let currentSpeechText = '';
  const storedVoiceGender = (() => { try { return localStorage.getItem('nexus.voiceGender') || 'auto'; } catch (_) { return 'auto'; } })();
  const storedVoiceLanguage = (() => { try { return localStorage.getItem('nexus.voiceLanguage') || 'auto'; } catch (_) { return 'auto'; } })();
  let preferredVoiceGender = ['auto', 'male', 'female'].includes(storedVoiceGender) ? storedVoiceGender : 'auto';
  let preferredVoiceLanguage = ['auto', 'english', 'urdu', 'hindi', 'roman_urdu'].includes(storedVoiceLanguage) ? storedVoiceLanguage : 'auto';
  let lastInputLanguage = 'english_or_mixed';
  let recognition = null;
  let recognitionActive = false;
  let recognitionStarting = false;
  let shouldListen = true;
  let restartTimer = null;
  let restartAttempts = 0;
  let lastSentText = '';
  let lastSentAt = 0;
  let isJarvisSpeaking = false;
  let requestCounter = 0;
  let speechBuffer = '';
  let speechFlushTimer = null;
  let userSpeechPulseTimer = null;
  const pendingRequests = new Map();
  const commandHistory = [];
  const startedAt = Date.now();

  const stateFromLabel = (label) => {
    const value = String(label || '').toLowerCase();
    if (value.includes('listen')) return 'listening';
    if (value.includes('respond') || value.includes('speak')) return 'speaking';
    if (value.includes('execut')) return 'executing';
    if (value.includes('error') || value.includes('limited') || value.includes('permission') || value.includes('offline')) return 'error';
    if (value.includes('process') || value.includes('retriev') || value.includes('verif') || value.includes('generat') || value.includes('think')) return 'thinking';
    return 'idle';
  };

  function setVisualState(state) {
    const allowed = ['idle', 'listening', 'thinking', 'speaking', 'executing', 'error'];
    const normalized = allowed.includes(state) ? state : 'idle';
    document.body.dataset.uiState = normalized;
    $('coreScene').dataset.state = normalized;
    if (normalized === 'speaking') document.body.classList.remove('user-speaking');
  }

  function pulseUserSpeech() {
    document.body.classList.add('user-speaking');
    clearTimeout(userSpeechPulseTimer);
    userSpeechPulseTimer = setTimeout(() => document.body.classList.remove('user-speaking'), 680);
  }

  function stopUserSpeechPulse() {
    clearTimeout(userSpeechPulseTimer);
    document.body.classList.remove('user-speaking');
  }

  function setStatus(label, detail, speaking = false) {
    $('statusLabel').textContent = label;
    $('statusDetail').textContent = detail || '';
    $('voiceState').textContent = speaking ? 'JARVIS AUDIO OUTPUT' : `VOICE CHANNEL • ${voiceLanguageLabel()} • ${voiceGenderLabel()}`;
    $('footerStatus').textContent = speaking ? 'JARVIS RESPONDING' : 'LISTENING 24/7';
    setVisualState(speaking ? 'speaking' : stateFromLabel(label));
  }

  function addNotice(text) {
    const list = $('noticeList');
    const item = document.createElement('li');
    item.innerHTML = '<span></span><span></span>';
    item.lastElementChild.textContent = text;
    list.prepend(item);
    while (list.children.length > 3) list.lastElementChild.remove();
  }

  function addCommand(text) {
    if (!text) return;
    const now = new Date();
    const time = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    commandHistory.unshift({ time, text });
    commandHistory.splice(5);
    $('commandCount').textContent = String(commandHistory.length);
    $('historyList').innerHTML = commandHistory.map((item) => `<li><span>${item.time}</span><span>${escapeHtml(item.text)}</span></li>`).join('');
  }

  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[char]));
  }

  function updateClock() {
    $('clock').textContent = new Date().toLocaleString([], { weekday: 'short', month: 'short', day: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    const elapsed = Math.floor((Date.now() - startedAt) / 1000);
    const h = String(Math.floor(elapsed / 3600)).padStart(2, '0');
    const m = String(Math.floor((elapsed % 3600) / 60)).padStart(2, '0');
    const s = String(elapsed % 60).padStart(2, '0');
    $('uptime').textContent = `UPTIME: ${h}:${m}:${s}`;
  }

  async function updateBattery() {
    try {
      if (!navigator.getBattery) return;
      const battery = await navigator.getBattery();
      const update = () => { $('battery').textContent = `BATTERY ${Math.round(battery.level * 100)}%${battery.charging ? ' • CHARGING' : ''}`; };
      update(); battery.addEventListener('levelchange', update); battery.addEventListener('chargingchange', update);
    } catch (_) { $('battery').textContent = 'BATTERY N/A'; }
  }

  function detectLanguageHint(text) {
    if (/[\u0600-\u06FF]/.test(text)) return 'urdu_script';
    if (/[\u0900-\u097F]/.test(text)) return 'hindi_script';
    if (/\b(?:mujhe|muje|aap|apko|tumhe|meri|mere|yaad|yad|bhool|bhul|kya|kia|hai|nahi|nhi|karo|krdo|acha|accha)\b/i.test(text)) return 'roman_urdu_or_hinglish';
    return 'english_or_mixed';
  }

  function voiceLanguageLabel(language = preferredVoiceLanguage) {
    return ({ auto: 'AUTO', english: 'ENGLISH', urdu: 'URDU', hindi: 'HINDI', roman_urdu: 'ROMAN URDU' }[language] || 'AUTO');
  }

  function voiceGenderLabel(gender = preferredVoiceGender) {
    return ({ auto: 'AUTO', male: 'MALE', female: 'FEMALE' }[gender] || 'AUTO');
  }

  function updateVoicePreferenceDisplay() {
    const label = `VOICE ${voiceLanguageLabel()} • ${voiceGenderLabel()}`;
    $('voiceModule').textContent = label;
    $('voiceState').textContent = `VOICE CHANNEL • ${voiceLanguageLabel()} • ${voiceGenderLabel()}`;
  }

  function saveVoicePreferences() {
    try {
      localStorage.setItem('nexus.voiceGender', preferredVoiceGender);
      localStorage.setItem('nexus.voiceLanguage', preferredVoiceLanguage);
    } catch (_) { /* Private browsing may disable localStorage. */ }
    updateVoicePreferenceDisplay();
  }

  function recognitionLanguage() {
    if (preferredVoiceLanguage === 'urdu') return 'ur-PK';
    if (preferredVoiceLanguage === 'hindi') return 'hi-IN';
    if (preferredVoiceLanguage === 'english' || preferredVoiceLanguage === 'roman_urdu') return 'en-US';
    if (lastInputLanguage === 'urdu_script') return 'ur-PK';
    if (lastInputLanguage === 'hindi_script') return 'hi-IN';
    return 'en-US';
  }

  function restartRecognitionForPreference() {
    clearTimeout(restartTimer);
    if (!recognition) {
      if (shouldListen) setupSpeechRecognition();
      return;
    }
    const active = recognition;
    try { active.stop(); } catch (_) { if (shouldListen) scheduleRecognitionRestart(); }
  }

  function parseVoiceControl(text) {
    const value = String(text || '').trim();
    const lowered = value.toLowerCase();
    const femalePattern = /\b(?:female|woman|lady|girl|aurat|khatoon|khawateen|ladki|mahila)\b|स्त्री|महिला|औरत|خاتون|خواتین|عورت/i;
    const malePattern = /\b(?:male|man|gentleman|boy|mard|larka|ladka|mardana)\b|पुरुष|आदमी|लड़का|مرد|مردانہ|لڑکا/i;
    const genderMentions = value.match(/\b(?:female|woman|lady|girl|aurat|khatoon|khawateen|ladki|mahila|male|man|gentleman|boy|mard|larka|ladka|mardana)\b|स्त्री|महिला|औरत|خاتون|خواتین|عورت|पुरुष|आदमी|लड़का|مرد|مردانہ|لڑکا/gi) || [];
    const lastGenderMention = genderMentions[genderMentions.length - 1] || '';
    const female = femalePattern.test(value);
    const male = malePattern.test(value);
    const requestedGender = femalePattern.test(lastGenderMention) ? 'female' : (malePattern.test(lastGenderMention) ? 'male' : null);
    const languagePattern = /\b(?:urdu|pakistani urdu|hindi|roman urdu|roman|english)\b|اردو|हिन्दी|हिंदी|رومن اردو|انگریزی|अंग्रेज़ी|अंग्रेजी/gi;
    const languageMentions = value.match(languagePattern) || [];
    const lastLanguageMention = languageMentions[languageMentions.length - 1] || '';
    const language = /roman|رومن اردو/i.test(lastLanguageMention) ? 'roman_urdu'
      : /urdu|اردو/i.test(lastLanguageMention) ? 'urdu'
      : /hindi|हिन्दी|हिंदी/i.test(lastLanguageMention) ? 'hindi'
      : /english|انگریزی|अंग्रेज़ी|अंग्रेजी/i.test(lastLanguageMention) ? 'english' : null;
    const resetGender = /\b(reset|auto(?:matic)?|default|natural)\s+(?:voice|gender)\b|\bvoice\s+(?:back\s+)?to\s+(?:default|normal|automatic)\b/i.test(lowered);
    const resetLanguage = /\b(reset|auto(?:matic)?|default)\s+(?:language|lang)\b|\b(language|zaban|زبان|भाषा)\s+(?:back\s+)?to\s+(?:default|normal|automatic)\b/i.test(lowered);
    const controlWord = /\b(?:switch|change|use|set|select|choose|make|speak|talk|reply|answer|respond|voice|gender|language|lang|zaban|awaz)\b|آواز|زبان|भाषा|आवाज़|बोलो|बोलें|بات کرو/i.test(value);
    const shortVoiceCommand = /^(?:female|male|woman|man|urdu|اردو|hindi|हिन्दी|हिंदी|english|انگریزی|अंग्रेज़ी|अंग्रेजी|roman urdu|auto(?:matic)?|default)\s*(?:voice|language|lang|gender)?[.!?]*$/i.test(value);
    if (!controlWord && !shortVoiceCommand) return null;
    if (!female && !male && !language && !resetGender && !resetLanguage) return null;
    return {
      gender: requestedGender || (resetGender ? 'auto' : null),
      language: language || (resetLanguage ? 'auto' : null),
    };
  }

  function localVoiceConfirmation(control) {
    const language = preferredVoiceLanguage !== 'auto' ? preferredVoiceLanguage : (control.language && control.language !== 'auto' ? control.language : (lastInputLanguage === 'urdu_script' ? 'urdu' : (lastInputLanguage === 'hindi_script' ? 'hindi' : 'english')));
    const genderText = voiceGenderLabel();
    const languageText = voiceLanguageLabel();
    if (language === 'urdu') return `ٹھیک ہے، اب آواز ${genderText === 'FEMALE' ? 'خواتین' : genderText === 'MALE' ? 'مردانہ' : 'خودکار'} ہے اور زبان ${languageText} ہے۔`;
    if (language === 'hindi') return `ठीक है, अब आवाज़ ${genderText === 'FEMALE' ? 'महिला' : genderText === 'MALE' ? 'पुरुष' : 'ऑटो'} है और भाषा ${languageText} है।`;
    if (language === 'roman_urdu') return `Theek hai, ab voice ${genderText.toLowerCase()} hai aur language ${languageText} hai.`;
    return `Voice updated to ${genderText.toLowerCase()} and ${languageText.toLowerCase()}.`;
  }

  function handleVoiceControl(text) {
    const control = parseVoiceControl(text);
    if (!control) return false;
    if (control.gender) preferredVoiceGender = control.gender;
    if (control.language) preferredVoiceLanguage = control.language;
    saveVoicePreferences();
    addCommand(text);
    $('jarvisLive').textContent = localVoiceConfirmation(control);
    $('taskTitle').textContent = 'Voice preference updated';
    $('taskDetail').textContent = `${voiceLanguageLabel()} • ${voiceGenderLabel()}`;
    addNotice(`Voice: ${voiceLanguageLabel()} • ${voiceGenderLabel()}`);
    speakReply($('jarvisLive').textContent);
    restartRecognitionForPreference();
    return true;
  }

  function sendQuestion(text, languageHint) {
    const requestId = `${Date.now()}-${++requestCounter}`;
    const timeout = setTimeout(() => {
      if (!pendingRequests.has(requestId)) return;
      pendingRequests.delete(requestId);
      $('taskState').textContent = 'RETRY READY';
      $('taskTitle').textContent = 'No response received';
      $('taskDetail').textContent = 'The command channel is still listening.';
      addNotice('No response arrived for one command; voice listening remains active.');
      setStatus('LISTENING', 'No response received. Ready for your next command.');
    }, 40000);
    pendingRequests.set(requestId, timeout);
    socket.emit('user_speech', { text, request_id: requestId, language_hint: languageHint || detectLanguageHint(text) });
  }

  function acknowledgeRequest(requestId) {
    if (requestId && pendingRequests.has(requestId)) {
      clearTimeout(pendingRequests.get(requestId));
      pendingRequests.delete(requestId);
      return;
    }
    if (!requestId && pendingRequests.size) {
      const first = pendingRequests.keys().next().value;
      clearTimeout(pendingRequests.get(first));
      pendingRequests.delete(first);
    }
  }

  function flushSpeechBuffer() {
    clearTimeout(speechFlushTimer);
    speechFlushTimer = null;
    const normalized = speechBuffer.trim().replace(/\s+/g, ' ');
    speechBuffer = '';
    if (!normalized) return;
    const now = Date.now();
    if (normalized === lastSentText && now - lastSentAt <= 1500) return;
    lastSentText = normalized;
    lastSentAt = now;
    if (handleVoiceControl(normalized)) return;
    addCommand(normalized);
    $('taskTitle').textContent = 'Processing command...';
    $('taskDetail').textContent = normalized;
    setStatus('PROCESSING', 'Understanding your request...');
    sendQuestion(normalized, detectLanguageHint(normalized));
  }

  function queueTranscript(text) {
    const clean = String(text || '').trim();
    if (!clean) return;
    speechBuffer = [speechBuffer, clean].filter(Boolean).join(' ').replace(/\s+/g, ' ');
    clearTimeout(speechFlushTimer);
    speechFlushTimer = setTimeout(flushSpeechBuffer, 850);
  }

  function isLikelySpeechEcho(text) {
    if (!isJarvisSpeaking || !currentSpeechText) return false;
    const normalize = (value) => String(value || '').toLowerCase().replace(/[^a-z0-9\u0600-\u06ff\u0900-\u097f]+/g, ' ').trim();
    const heard = normalize(text).split(/\s+/).filter(Boolean);
    const spoken = normalize(currentSpeechText).split(/\s+/).filter(Boolean);
    if (!heard.length || !spoken.length) return false;
    const spokenSet = new Set(spoken);
    const overlap = heard.filter((word) => spokenSet.has(word)).length / heard.length;
    return normalize(text) === normalize(currentSpeechText) || (heard.length >= 2 && overlap >= 0.65);
  }

  function setupSpeechRecognition() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) { setStatus('BROWSER AUDIO LIMITED', 'Use Chrome or Edge for live voice.'); return; }
    if (recognitionActive || recognitionStarting) return;
    clearTimeout(restartTimer);
    recognitionStarting = true;
    shouldListen = true;
    const instance = new SpeechRecognition();
    recognition = instance;
    instance.continuous = true;
    instance.interimResults = true;
    instance.lang = recognitionLanguage();
    instance.onstart = () => {
      if (recognition !== instance) return;
      recognitionActive = true;
      recognitionStarting = false;
      restartAttempts = 0;
      setVisualState('listening');
      $('voiceModule').textContent = `VOICE ${voiceLanguageLabel()} • ${voiceGenderLabel()}`;
      if (!isJarvisSpeaking) setStatus('LISTENING', 'Ready for your command...');
    };
    instance.onresult = (event) => {
      if (recognition !== instance) return;
      let interim = '';
      let finalTranscript = '';
      for (let i = event.resultIndex; i < event.results.length; i++) {
        if (event.results[i].isFinal) finalTranscript += event.results[i][0].transcript;
        else interim += event.results[i][0].transcript;
      }
      const activeText = (finalTranscript || interim).trim();
      if (activeText && isJarvisSpeaking && isLikelySpeechEcho(activeText)) {
        $('userLive').textContent = '';
        return;
      }
      if (activeText) {
        pulseUserSpeech();
        $('userLive').textContent = `YOU: ${activeText}`;
        if (isJarvisSpeaking) { if (synth) synth.cancel(); isJarvisSpeaking = false; currentSpeechText = ''; setStatus('LISTENING', 'Interrupted - listening again.'); }
      }
      if (finalTranscript.trim()) {
        lastInputLanguage = detectLanguageHint(finalTranscript);
        queueTranscript(finalTranscript);
      }
    };
    instance.onerror = (event) => {
      if (recognition !== instance) return;
      const permissionError = event.error === 'not-allowed' || event.error === 'service-not-allowed';
      recognitionActive = false;
      recognitionStarting = false;
      recognition = null;
      if (permissionError) {
        shouldListen = false;
        setStatus('MICROPHONE PERMISSION NEEDED', 'Allow microphone access, then tap the core once.');
        addNotice('Microphone permission is required for hands-free voice.');
        return;
      }
      if (shouldListen) scheduleRecognitionRestart();
    };
    instance.onend = () => {
      if (recognition !== instance) return;
      flushSpeechBuffer();
      recognitionActive = false;
      recognitionStarting = false;
      recognition = null;
      if (shouldListen) scheduleRecognitionRestart();
    };
    try { instance.start(); }
    catch (_) {
      if (recognition === instance) { recognition = null; recognitionStarting = false; recognitionActive = false; }
      if (shouldListen) scheduleRecognitionRestart();
    }
  }

  function scheduleRecognitionRestart() {
    clearTimeout(restartTimer);
    restartAttempts = Math.min(restartAttempts + 1, 6);
    const delay = Math.min(500 * Math.pow(2, restartAttempts - 1), 5000);
    restartTimer = setTimeout(() => { if (shouldListen && !recognitionActive && !recognitionStarting) setupSpeechRecognition(); }, delay);
  }

  function refreshSpeechVoices() {
    if (!synth) return [];
    speechVoices = synth.getVoices ? synth.getVoices() : [];
    return speechVoices;
  }

  function selectSpeechVoice(voices, languageCode) {
    const languageVoices = voices.filter((item) => new RegExp(`^${languageCode}`, 'i').test(item.lang || ''));
    const candidates = languageVoices.length ? languageVoices : voices;
    if (preferredVoiceGender === 'auto') return candidates[0] || null;
    const genderPattern = preferredVoiceGender === 'female'
      ? /female|woman|girl|jenny|zira|aria|samantha|susan|hazel|eva|sara|swara|uzma|google uk english female/i
      : /male|man|guy|david|mark|ryan|daniel|george|madhur|asad|google uk english male/i;
    return candidates.find((item) => genderPattern.test(item.name || '')) || candidates[0] || null;
  }

  function preferredOutputLanguage(text) {
    if (preferredVoiceLanguage !== 'auto') return preferredVoiceLanguage;
    if (/[\u0600-\u06FF]/.test(text)) return 'urdu';
    if (/[\u0900-\u097F]/.test(text)) return 'hindi';
    return 'english';
  }

  function outputLanguageDetails(text) {
    const language = preferredOutputLanguage(text);
    if (language === 'urdu') return { language, speechLang: 'ur-PK', voiceLang: 'ur' };
    if (language === 'hindi') return { language, speechLang: 'hi-IN', voiceLang: 'hi' };
    return { language, speechLang: 'en-US', voiceLang: 'en' };
  }

  function unlockSpeechOutput() {
    if (!synth || typeof SpeechSynthesisUtterance === 'undefined') return;
    try {
      const warmup = new SpeechSynthesisUtterance('');
      warmup.volume = 0;
      synth.speak(warmup);
      synth.cancel();
    } catch (_) { /* Some browsers require no warmup. */ }
  }

  function speakReply(text, attempt = 0) {
    if (!text) return;
    if (!synth || typeof SpeechSynthesisUtterance === 'undefined') {
      setStatus('TEXT ONLY', 'This browser does not provide speech output.');
      addNotice('Browser speech output is unavailable. Use current Chrome or Edge.');
      return;
    }
    const voices = refreshSpeechVoices();
    if (!voices.length && attempt < 6) { setTimeout(() => speakReply(text, attempt + 1), 250); return; }
    try {
      synth.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 1.04;
      utterance.pitch = preferredVoiceGender === 'female' ? 1.14 : (preferredVoiceGender === 'male' ? .88 : 1);
      utterance.volume = 1;
      currentSpeechText = text;
      const output = outputLanguageDetails(text);
      utterance.lang = output.speechLang;
      const voice = selectSpeechVoice(voices, output.voiceLang);
      if (voice) utterance.voice = voice;
      if (preferredVoiceGender !== 'auto' && voice) {
        const genderPattern = preferredVoiceGender === 'female'
          ? /female|woman|girl|jenny|zira|aria|samantha|susan|hazel|eva|sara|swara|uzma|google uk english female/i
          : /male|man|guy|david|mark|ryan|daniel|george|madhur|asad|google uk english male/i;
        if (!genderPattern.test(voice.name || '')) addNotice(`No named ${preferredVoiceGender} ${output.language} voice was found; using ${voice.name || 'browser default'} with pitch adjustment.`);
      }
      utterance.onstart = () => { stopUserSpeechPulse(); isJarvisSpeaking = true; setStatus('RESPONDING', 'JARVIS is speaking...', true); };
      utterance.onend = () => { isJarvisSpeaking = false; currentSpeechText = ''; setStatus('LISTENING', 'Ready for your command...'); };
      utterance.onerror = (event) => {
        stopUserSpeechPulse();
        isJarvisSpeaking = false;
        currentSpeechText = '';
        if (event.error !== 'interrupted' && event.error !== 'canceled') {
          setStatus('AUDIO OUTPUT ERROR', 'Text reply received, but the browser could not speak it.');
          addNotice(`Speech output error: ${event.error || 'unknown browser audio error'}.`);
        } else setStatus('LISTENING', 'Ready for your command...');
      };
      synth.speak(utterance);
    } catch (error) {
      isJarvisSpeaking = false;
      currentSpeechText = '';
      setStatus('AUDIO OUTPUT ERROR', 'Text reply received, but speech output failed.');
      addNotice(`Speech output exception: ${error.message || 'unknown browser error'}.`);
    }
  }

  function setupAmbientCanvas() {
    if (!ambientCanvas || !ambientCanvas.getContext) return;
    const context = ambientCanvas.getContext('2d');
    const particles = Array.from({ length: 68 }, (_, index) => ({
      x: Math.random(), y: Math.random(), size: .35 + Math.random() * 1.35, alpha: .14 + Math.random() * .44,
      phase: Math.random() * Math.PI * 2, speed: .00012 + Math.random() * .00034, drift: index % 2 ? 1 : -1
    }));
    let width = 0, height = 0, ratio = 1, running = false;
    const resize = () => {
      ratio = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth; height = window.innerHeight;
      ambientCanvas.width = Math.floor(width * ratio); ambientCanvas.height = Math.floor(height * ratio);
      ambientCanvas.style.width = `${width}px`; ambientCanvas.style.height = `${height}px`;
      context.setTransform(ratio, 0, 0, ratio, 0, 0);
    };
    const draw = (now) => {
      if (document.hidden) { running = false; return; }
      context.clearRect(0, 0, width, height);
      const centerX = width * .5, centerY = height * .48;
      for (const particle of particles) {
        const drift = Math.sin(now * particle.speed + particle.phase) * 9 * particle.drift;
        const x = particle.x * width + drift;
        const y = particle.y * height + Math.cos(now * particle.speed + particle.phase) * 6;
        const pulse = .68 + Math.sin(now * .0012 + particle.phase) * .32;
        context.beginPath();
        context.fillStyle = `rgba(123, 224, 251, ${particle.alpha * pulse})`;
        context.arc(x, y, particle.size, 0, Math.PI * 2);
        context.fill();
      }
      const haze = context.createRadialGradient(centerX, centerY, 0, centerX, centerY, Math.min(width, height) * .42);
      haze.addColorStop(0, 'rgba(61, 194, 231, .035)'); haze.addColorStop(1, 'rgba(61, 194, 231, 0)');
      context.fillStyle = haze; context.fillRect(0, 0, width, height);
      requestAnimationFrame(draw);
    };
    const start = () => { if (!running) { running = true; requestAnimationFrame(draw); } };
    resize(); start();
    window.addEventListener('resize', resize, { passive: true });
    document.addEventListener('visibilitychange', () => { if (!document.hidden) start(); });
  }

  function setupCoreCanvas() {
    if (!coreCanvas || !coreCanvas.getContext) return;
    const context = coreCanvas.getContext('2d');
    const particles = Array.from({ length: 54 }, (_, index) => ({ radius: .18 + Math.random() * .34, angle: Math.random() * Math.PI * 2, speed: (.00015 + Math.random() * .00035) * (index % 2 ? 1 : -1), size: .45 + Math.random() * 1.1, phase: Math.random() * Math.PI * 2 }));
    let width = 0, height = 0, ratio = 1, running = false;
    const resize = () => {
      const box = coreCanvas.getBoundingClientRect();
      ratio = Math.min(window.devicePixelRatio || 1, 2);
      width = Math.max(1, box.width); height = Math.max(1, box.height);
      coreCanvas.width = Math.floor(width * ratio); coreCanvas.height = Math.floor(height * ratio);
      context.setTransform(ratio, 0, 0, ratio, 0, 0);
    };
    const draw = (now) => {
      if (document.hidden) { running = false; return; }
      context.clearRect(0, 0, width, height);
      const cx = width / 2, cy = height / 2, radius = Math.min(width, height) * .37;
      const state = $('coreScene').dataset.state || 'idle';
      const speed = { idle: .45, listening: 1.05, thinking: 1.75, speaking: .9, executing: 2.15, error: .18 }[state] || .45;
      context.save();
      context.globalCompositeOperation = 'lighter';
      const positions = [];
      for (const particle of particles) {
        const angle = particle.angle + now * particle.speed * speed;
        const orbitRadius = radius * particle.radius;
        const flatten = .58 + Math.sin(particle.phase) * .15;
        const x = cx + Math.cos(angle) * orbitRadius;
        const y = cy + Math.sin(angle) * orbitRadius * flatten;
        const alpha = .2 + (.35 * (.5 + .5 * Math.sin(now * .0015 + particle.phase)));
        positions.push({ x, y, alpha, angle, orbitRadius, flatten });
        context.beginPath();
        context.fillStyle = `rgba(158, 238, 255, ${alpha})`;
        context.arc(x, y, particle.size, 0, Math.PI * 2);
        context.fill();
        if (state === 'thinking' || state === 'executing') {
          context.beginPath();
          context.strokeStyle = `rgba(107, 220, 251, ${alpha * .45})`;
          context.lineWidth = .55;
          context.moveTo(cx + Math.cos(angle - .08) * orbitRadius, cy + Math.sin(angle - .08) * orbitRadius * flatten);
          context.lineTo(x, y);
          context.stroke();
        }
      }
      // Fine links make the sphere feel like a living information lattice,
      // without creating hundreds of DOM elements or expensive geometry.
      for (let index = 0; index < positions.length; index += 3) {
        const first = positions[index];
        const second = positions[(index * 7 + 11) % positions.length];
        context.beginPath();
        context.strokeStyle = `rgba(105, 219, 251, ${Math.min(first.alpha, second.alpha) * .16})`;
        context.lineWidth = .38;
        context.moveTo(first.x, first.y);
        context.quadraticCurveTo(cx, cy, second.x, second.y);
        context.stroke();
      }
      // A few warm threads keep the intelligence energy concentrated at the center.
      for (let index = 0; index < 5; index++) {
        const angle = now * .00032 * speed + index * (Math.PI * 2 / 5);
        const inner = radius * (.12 + index * .012);
        const outer = radius * (.31 + (index % 2) * .04);
        context.beginPath();
        context.strokeStyle = `rgba(255, 191, 103, ${state === 'error' ? .13 : .22})`;
        context.lineWidth = .7;
        context.moveTo(cx + Math.cos(angle) * inner, cy + Math.sin(angle) * inner * .72);
        context.quadraticCurveTo(cx + Math.cos(angle + 1.1) * outer * .8, cy + Math.sin(angle + 1.1) * outer * .5, cx + Math.cos(angle + 2.25) * outer, cy + Math.sin(angle + 2.25) * outer * .62);
        context.stroke();
      }
      context.restore();
      requestAnimationFrame(draw);
    };
    const start = () => { if (!running) { running = true; requestAnimationFrame(draw); } };
    resize(); start();
    window.addEventListener('resize', resize, { passive: true });
    document.addEventListener('visibilitychange', () => { if (!document.hidden) start(); });
  }

  if (synth && 'onvoiceschanged' in synth) synth.onvoiceschanged = refreshSpeechVoices;
  refreshSpeechVoices();
  updateVoicePreferenceDisplay();
  setupAmbientCanvas();
  setupCoreCanvas();

  $('micButton').addEventListener('click', (event) => {
    event.stopPropagation();
    shouldListen = true;
    unlockSpeechOutput();
    if (!recognition || (!recognitionActive && !recognitionStarting)) setupSpeechRecognition();
  });
  window.addEventListener('click', () => { unlockSpeechOutput(); if (!recognitionActive && !recognitionStarting) setupSpeechRecognition(); });
  socket.on('connect', () => { $('connectionLabel').textContent = 'ONLINE'; addNotice('Secure Socket.IO connection established.'); if (!recognitionActive && !recognitionStarting) setupSpeechRecognition(); });
  socket.on('disconnect', () => { $('connectionLabel').textContent = 'RECONNECTING'; setStatus('RECONNECTING', 'Restoring live command channel...'); });
  socket.on('system_status', (data) => {
    $('modelLabel').textContent = `MODEL: ${data.model || 'ONLINE'}`;
    if (data.memory) $('memoryStats').textContent = `MEMORY: ${data.memory.facts || 0} FACTS`;
    if (data.knowledge) {
      $('retrievalStatus').textContent = `KNOWLEDGE: ${data.knowledge.backend === 'disabled' ? 'OFF' : `${data.knowledge.chunks || 0} CHUNKS`}`;
      addNotice(data.knowledge.diagnostic || 'Knowledge status received.');
    }
    if (data.web) addNotice(data.web.diagnostic || 'Live web status received.');
  });
  socket.on('status', (data) => {
    if (data.state === 'retrieving') { $('taskState').textContent = 'RETRIEVING'; setStatus('RETRIEVING', 'Checking the local knowledge base...'); }
    else if (data.state === 'verifying') { $('taskState').textContent = 'VERIFYING'; setStatus('VERIFYING', 'Running the configured answer check...'); }
    else if (data.state === 'thinking') { $('taskState').textContent = 'THINKING'; setStatus('THINKING', 'Understanding your request...'); }
    else if (data.state === 'executing') { $('taskState').textContent = 'EXECUTING'; setStatus('EXECUTING', data.message || 'Running autonomous engine...'); if (data.message) $('jarvisLive').textContent += `\n${data.message}`; }
  });
  socket.on('jarvis_reply_token', (data) => {
    if (data.is_first) { $('jarvisLive').textContent = data.token; $('taskState').textContent = 'GENERATING'; setStatus('THINKING', 'Streaming response...'); }
    else $('jarvisLive').textContent += data.token;
  });
  socket.on('jarvis_reply', (data) => {
    acknowledgeRequest(data.request_id);
    const text = data.text || '';
    $('jarvisLive').textContent = text;
    $('taskState').textContent = 'IDLE';
    $('taskTitle').textContent = 'Waiting for your command...';
    const sourceCount = Array.isArray(data.sources) ? data.sources.length : 0;
    const verification = data.verification && data.verification.performed ? ' • VERIFIED' : '';
    const retrievalLabel = data.web_retrieval_active ? ' • LIVE WEB' : (sourceCount ? ' • LOCAL DOCS' : '');
    $('taskDetail').textContent = data.memory_command ? 'Memory command completed' : `${data.task_type || 'GENERAL'} • ${data.provider || 'local'}${sourceCount ? ` • ${sourceCount} source(s)` : ''}${retrievalLabel}${verification}`;
    $('modelLabel').textContent = `MODEL: ${data.provider && data.model ? `${data.provider}/${data.model}` : 'ONLINE'}`;
    $('retrievalStatus').textContent = data.web_retrieval_active ? `WEB: ${sourceCount} SOURCES` : (data.retrieval_active ? `KNOWLEDGE: ${sourceCount} SOURCES` : 'KNOWLEDGE: INACTIVE');
    addNotice(data.retrieval_active ? `Response grounded in ${sourceCount} retrieved source(s).` : 'Response delivered successfully.');
    setVisualState('idle');
    speakReply(text);
  });
  socket.on('memory_stats', (data) => { $('memoryStats').textContent = `MEMORY: ${data.facts || 0} FACTS`; });
  socket.on('metrics', (data) => { $('cpuMetric').textContent = `${data.cpu}%`; $('ramMetric').textContent = `${data.ram_used}/${data.ram_total} GB`; });
  setInterval(() => { socket.emit('get_metrics'); updateClock(); }, 3000);
  updateClock(); updateBattery();
})();
</script>
</body>
</html>
