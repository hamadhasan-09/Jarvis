<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#02050a">
<title>JARVIS</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.4/socket.io.min.js"></script>
<style>
:root{
  --bg:#02050a;
  --cyan:#66e7ff;
  --cyan2:#bdf7ff;
  --amber:#ffbf69;
  --amber2:#fff2bf;
  --green:#8dffc7;
  --danger:#ff8e8e;
  --state-accent:var(--cyan);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  background:
    radial-gradient(circle at 50% 48%,rgba(48,168,215,.10),transparent 32%),
    radial-gradient(circle at 50% 52%,rgba(255,175,70,.045),transparent 24%),
    #02050a;
  color:#fff;
  font-family:Inter,"Segoe UI",sans-serif;
}
body:before{
  content:"";
  position:fixed;inset:0;pointer-events:none;z-index:1;
  background:
    radial-gradient(ellipse at center,transparent 42%,rgba(0,0,0,.36) 78%,rgba(0,0,0,.78) 100%),
    linear-gradient(180deg,rgba(255,255,255,.012),transparent 24%,transparent 76%,rgba(255,255,255,.01));
}
#space{
  position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;
}
.scene{
  position:fixed;inset:0;display:grid;place-items:center;z-index:2;
  perspective:1200px;
}
.core{
  --scale:1;
  width:min(62vmin,760px);
  aspect-ratio:1;
  position:relative;
  transform:scale(var(--scale));
  transform-style:preserve-3d;
  filter:drop-shadow(0 0 34px rgba(53,194,239,.15));
  animation:float 9s ease-in-out infinite;
}
.core .halo,
.core .ring,
.core .axis,
.core .sat,
.core .filament,
.core .orb,
.core .center{
  position:absolute;left:50%;top:50%;pointer-events:none;
}
.halo{
  width:84%;height:84%;transform:translate(-50%,-50%);
  border-radius:50%;
  background:radial-gradient(circle,rgba(77,215,255,.09),rgba(24,115,158,.045) 36%,transparent 70%);
  filter:blur(8px);
  animation:halo 4.8s ease-in-out infinite;
}
.ring{
  width:var(--s);height:var(--s);
  transform:translate(-50%,-50%) rotateX(var(--rx)) rotateY(var(--ry)) rotateZ(var(--rz));
  border:1px solid rgba(105,228,255,.48);
  border-radius:50%;
  box-shadow:0 0 9px rgba(77,207,245,.22),inset 0 0 9px rgba(77,207,245,.08);
  transform-style:preserve-3d;
}
.ring:before{
  content:"";position:absolute;inset:-1px;border-radius:inherit;
  border-top-color:transparent;border-left-color:transparent;
  border-right:1px solid rgba(226,251,255,.72);
  border-bottom:1px solid rgba(57,185,226,.42);
  filter:drop-shadow(0 0 4px rgba(98,222,255,.65));
}
.r1{--s:92%;--rx:70deg;--ry:0deg;--rz:14deg;animation:spin1 17s linear infinite}
.r2{--s:78%;--rx:64deg;--ry:13deg;--rz:-34deg;animation:spin2 24s linear infinite reverse;opacity:.8}
.r3{--s:64%;--rx:0deg;--ry:68deg;--rz:25deg;animation:spin3 13s linear infinite;opacity:.72}
.r4{--s:49%;--rx:72deg;--ry:-10deg;--rz:72deg;animation:spin4 10s linear infinite reverse;opacity:.64;border-color:rgba(255,190,105,.36)}
.r5{--s:110%;--rx:80deg;--ry:8deg;--rz:-8deg;animation:spin5 33s linear infinite reverse;opacity:.24;border-style:dashed}
.axis{
  width:1px;height:108%;transform:translate(-50%,-50%);
  background:linear-gradient(180deg,transparent,rgba(163,242,255,.55) 18%,rgba(255,195,107,.34) 48%,rgba(147,237,255,.46) 78%,transparent);
  box-shadow:0 0 8px rgba(123,230,255,.55);
  opacity:.46;
}
.axis.x{
  width:108%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(163,242,255,.55) 18%,rgba(255,195,107,.34) 48%,rgba(147,237,255,.46) 78%,transparent);
}
.sat{
  width:7px;height:7px;border-radius:50%;
  background:radial-gradient(circle,#fff7cf 0 22%,var(--amber) 32%,rgba(255,156,54,.25) 70%,transparent 72%);
  box-shadow:0 0 8px var(--amber),0 0 18px rgba(255,180,82,.7);
}
.sat:after{
  content:"";position:absolute;inset:-5px;border:1px solid rgba(255,205,125,.34);border-radius:50%;
}
.s1{margin:-28% 0 0 -36%;animation:s1 8s ease-in-out infinite}
.s2{margin:-6% 0 0 35%;animation:s2 9.5s ease-in-out infinite reverse}
.s3{margin:31% 0 0 18%;width:5px;height:5px;animation:s3 6.7s ease-in-out infinite}
.filament{
  width:30%;height:8%;
  transform:translate(-50%,-50%) rotate(-18deg);
  border-radius:50%;
  border:1px solid rgba(255,214,137,.9);
  box-shadow:0 0 8px rgba(255,202,111,.8),0 0 24px rgba(255,162,63,.42);
  opacity:.72;
  animation:filament 2.2s ease-in-out infinite;
}
.filament.f2{transform:translate(-50%,-50%) rotate(54deg) scaleX(.78);opacity:.46;animation-delay:-.7s}
.center{
  width:25%;height:25%;transform:translate(-50%,-50%);
  border-radius:50%;
  z-index:8;
  background:
    radial-gradient(circle at 34% 29%,#ffffff 0 5%,var(--amber2) 12%,#ffc867 28%,rgba(255,125,31,.72) 48%,rgba(127,55,19,.28) 63%,transparent 76%);
  box-shadow:
    0 0 11px #fff5d2,
    0 0 28px rgba(255,198,112,.95),
    0 0 66px rgba(255,148,46,.54),
    inset 0 0 18px rgba(255,255,235,.94);
  animation:breathe 3.3s ease-in-out infinite;
}
.center:before{
  content:"";position:absolute;inset:9%;border-radius:50%;
  border:1px solid rgba(255,239,185,.72);
  background:repeating-conic-gradient(from 25deg,transparent 0 11deg,rgba(255,240,190,.35) 12deg 13deg,transparent 15deg 25deg);
  box-shadow:0 0 16px rgba(255,191,95,.76),inset 0 0 12px rgba(255,246,202,.55);
  animation:inner 2.4s linear infinite;
}
.center:after{
  content:"";position:absolute;inset:43%;border-radius:50%;background:#fff;
  box-shadow:0 0 10px #fff,0 0 24px var(--amber);
}
#coreCanvas{
  position:absolute;inset:-12%;width:124%;height:124%;z-index:7;pointer-events:none;
}
#sonicWaves{
  position:absolute;left:50%;top:50%;width:200%;height:200%;
  transform:translate(-50%,-50%);z-index:5;pointer-events:none;
  opacity:0;
}
.wave{
  position:absolute;left:50%;top:50%;width:var(--w);height:var(--w);
  transform:translate(-50%,-50%) scale(.72);
  border:1px solid rgba(112,228,255,.65);border-radius:50%;
  box-shadow:0 0 18px rgba(76,206,255,.22);
  animation:wave 1.3s cubic-bezier(.18,.72,.24,1) infinite;
}
.w2{--w:56%;animation-delay:.43s;border-color:rgba(112,228,255,.48)}
.w3{--w:73%;animation-delay:.86s;border-color:rgba(255,191,105,.32)}
.core[data-state=speaking] #sonicWaves{opacity:1}
.core[data-state=speaking] .center{animation:speak 1.3s cubic-bezier(.22,.78,.2,1) infinite}
.core[data-state=speaking]{--scale:1.018;filter:drop-shadow(0 0 42px rgba(255,183,89,.26))}
.core[data-state=listening]{--scale:.994;filter:drop-shadow(0 0 40px rgba(65,210,255,.25))}
.core[data-state=thinking],.core[data-state=executing],.core[data-state=retrieving],.core[data-state=verifying]{--scale:1.022;filter:drop-shadow(0 0 44px rgba(65,210,255,.3))}
.core[data-state=waiting_confirmation]{--scale:1.02}
.core[data-state=waiting_confirmation] .ring{border-color:rgba(255,220,115,.7)}
.core[data-state=completed],.core[data-state=approved]{filter:drop-shadow(0 0 46px rgba(122,255,196,.3))}
.core[data-state=error],.core[data-state=failed]{filter:drop-shadow(0 0 38px rgba(255,102,102,.28));--scale:.99}
#presence{
  position:fixed;left:50%;bottom:5.5vh;transform:translateX(-50%);
  z-index:20;display:flex;flex-direction:column;align-items:center;gap:7px;
  opacity:.72;pointer-events:none;transition:opacity .5s;
}
#presence .line{display:flex;align-items:center;gap:8px;font-size:9px;letter-spacing:.28em;color:rgba(208,240,247,.66)}
#beacon{width:5px;height:5px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
#state{font-family:Consolas,monospace;font-size:8px;letter-spacing:.2em;color:rgba(176,214,225,.34)}
#transcript,#reply{display:none}
#approvalModal{
  position:fixed;inset:0;display:none;z-index:100;
  background:rgba(0,0,0,.48);backdrop-filter:blur(8px);
}
.approval-card{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(460px,calc(100vw - 36px));
  padding:24px;border:1px solid rgba(117,229,255,.28);border-radius:20px;
  background:rgba(4,12,18,.92);box-shadow:0 0 60px rgba(62,197,237,.12),inset 0 0 30px rgba(62,197,237,.035);
}
.approval-kicker{font-size:9px;letter-spacing:.28em;color:var(--amber);margin-bottom:12px}
.approval-title{font-size:18px;letter-spacing:.04em;color:#ecfbff;margin-bottom:10px}
.approval-copy{font-size:12px;line-height:1.55;color:rgba(201,232,239,.68)}
.approval-meta{margin-top:14px;padding:11px 0;border-top:1px solid rgba(129,224,247,.08);border-bottom:1px solid rgba(129,224,247,.08);font:10px/1.7 Consolas,monospace;color:rgba(180,221,231,.62)}
.approval-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:17px}
.approval-actions button{
  border:1px solid rgba(122,229,252,.24);border-radius:999px;padding:9px 16px;
  background:rgba(12,27,35,.8);color:#dff8ff;cursor:pointer
}
.approval-actions .deny{border-color:rgba(255,142,142,.22);color:#ffb0b0}
.approval-actions .approve{border-color:rgba(141,255,199,.28);color:#b8ffd9}
@keyframes float{0%,100%{transform:translateY(0) scale(var(--scale))}50%{transform:translateY(-7px) scale(var(--scale))}}
@keyframes halo{0%,100%{transform:translate(-50%,-50%) scale(.98);opacity:.72}50%{transform:translate(-50%,-50%) scale(1.05);opacity:1}}
@keyframes breathe{0%,100%{transform:translate(-50%,-50%) scale(.978)}50%{transform:translate(-50%,-50%) scale(1.018)}}
@keyframes speak{0%{transform:translate(-50%,-50%) scale(1)}10%{transform:translate(-50%,-50%) scale(1.038)}35%{transform:translate(-50%,-50%) scale(1.016)}100%{transform:translate(-50%,-50%) scale(1)}}
@keyframes inner{to{transform:rotate(360deg)}}
@keyframes filament{0%,100%{transform:translate(-50%,-50%) rotate(-18deg) scaleX(.95);opacity:.58}50%{transform:translate(-50%,-50%) rotate(-13deg) scaleX(1.08);opacity:.9}}
@keyframes spin1{to{transform:translate(-50%,-50%) rotateX(70deg) rotateY(0) rotateZ(374deg)}}
@keyframes spin2{to{transform:translate(-50%,-50%) rotateX(64deg) rotateY(13deg) rotateZ(-394deg)}}
@keyframes spin3{to{transform:translate(-50%,-50%) rotateY(68deg) rotateZ(385deg)}}
@keyframes spin4{to{transform:translate(-50%,-50%) rotateX(72deg) rotateZ(-288deg)}}
@keyframes spin5{to{transform:translate(-50%,-50%) rotateX(80deg) rotateZ(-368deg)}}
@keyframes wave{0%{opacity:0;transform:translate(-50%,-50%) scale(.72)}10%{opacity:.7}34%{opacity:.46}100%{opacity:0;transform:translate(-50%,-50%) scale(1.07)}}
@keyframes s1{0%,100%{transform:translate(0,0) scale(.85)}50%{transform:translate(12px,-9px) scale(1.12)}}
@keyframes s2{0%,100%{transform:translate(0,0) scale(.8)}50%{transform:translate(-15px,10px) scale(1.15)}}
@keyframes s3{0%,100%{transform:translate(0,0)}50%{transform:translate(8px,-12px)}}
@media (max-width:700px){.core{width:72vmin}.approval-card{padding:20px}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:1ms!important;animation-iteration-count:1!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="space"></canvas>

<div class="scene">
  <div id="coreScene" class="core" data-state="idle" aria-label="JARVIS core">
    <div class="halo"></div>
    <div class="ring r5"></div>
    <div class="ring r1"></div>
    <div class="ring r2"></div>
    <div class="ring r3"></div>
    <div class="ring r4"></div>
    <div class="axis"></div>
    <div class="axis x"></div>
    <div class="sat s1"></div>
    <div class="sat s2"></div>
    <div class="sat s3"></div>
    <div class="filament"></div>
    <div class="filament f2"></div>
    <canvas id="coreCanvas"></canvas>
    <div id="sonicWaves">
      <div class="wave"></div>
      <div class="wave w2"></div>
      <div class="wave w3"></div>
    </div>
    <div class="center"></div>
  </div>
</div>


<div id="transcript" aria-hidden="true"></div>
<div id="reply" aria-hidden="true"></div>

<div id="approvalModal">
  <div class="approval-card">
    <div class="approval-kicker">AUTHORIZATION REQUIRED</div>
    <div id="approvalAction" class="approval-title">Pending action</div>
    <div id="approvalPrompt" class="approval-copy">JARVIS requires authorization to proceed.</div>
    <div class="approval-meta">
      <div>TARGET: <span id="approvalTarget">N/A</span></div>
      <div>RISK: <span id="approvalRisk">UNKNOWN</span></div>
    </div>
    <div class="approval-actions">
      <button class="deny" id="denyBtn">DENY</button>
      <button class="approve" id="approveBtn">AUTHORIZE</button>
    </div>
  </div>
</div>

<script>
(function(){
  'use strict';
  const core = document.getElementById('coreScene');
  const approvalModal = document.getElementById('approvalModal');
  const approvalAction = document.getElementById('approvalAction');
  const approvalPrompt = document.getElementById('approvalPrompt');
  const approvalTarget = document.getElementById('approvalTarget');
  const approvalRisk = document.getElementById('approvalRisk');
  const space = document.getElementById('space');
  const coreCanvas = document.getElementById('coreCanvas');
  let currentApprovalId = null;
  let resetTimer = null;

  const socket = io({ transports:['websocket','polling'], reconnection:true, reconnectionAttempts:Infinity });

  const setState = (next, detail) => {
    core.dataset.state = next || 'idle';
    document.documentElement.style.setProperty('--state-accent',
      next==='error'||next==='failed' ? 'var(--danger)' :
      next==='approved'||next==='completed' ? 'var(--green)' :
      next==='waiting_confirmation' ? '#ffe071' : 'var(--cyan)'
    );
  };

  const resetToIdle = (ms=1800) => {
    clearTimeout(resetTimer);
    resetTimer = setTimeout(()=>setState('idle','STANDBY'),ms);
  };

  window.sendApprovalResponse = function(result){
    if(!currentApprovalId) return;
    socket.emit('approval_response',{id:currentApprovalId,result:Boolean(result)});
    approvalModal.style.display='none';
    setState(result?'approved':'cancelled',result?'AUTHORIZED':'CANCELLED');
    currentApprovalId=null;
    if(result) resetToIdle(2200);
    else resetToIdle(1500);
  };

  document.getElementById('approveBtn').onclick=()=>window.sendApprovalResponse(true);
  document.getElementById('denyBtn').onclick=()=>window.sendApprovalResponse(false);

  socket.on('connect',()=>{
    setState('idle','STANDBY');
  });
  socket.on('disconnect',()=>{
    setState('error','RECONNECTING');
  });
  socket.on('status',(data)=>{
    const s=String((data&&data.state)||'').toLowerCase();
    const map={
      thinking:['thinking','THINKING'],
      retrieving:['retrieving','RETRIEVING'],
      searching:['searching','SEARCHING'],
      verifying:['verifying','VERIFYING'],
      executing:['executing','EXECUTING'],
      waiting_confirmation:['waiting_confirmation','AUTHORIZATION'],
      approved:['approved','AUTHORIZED'],
      completed:['completed','COMPLETE'],
      cancelled:['cancelled','CANCELLED'],
      failed:['failed','FAILED'],
      error:['error','ERROR']
    };
    if(map[s]) setState(map[s][0],map[s][1]);
  });
  socket.on('approval_request',(data)=>{
    currentApprovalId=data && data.id ? data.id : null;
    approvalAction.textContent=(data&&data.action_type)||'Pending action';
    approvalPrompt.textContent=(data&&data.prompt_text)||'JARVIS requires authorization to proceed with this action.';
    approvalTarget.textContent=(data&&data.target)||'N/A';
    approvalRisk.textContent=String((data&&data.risk_level)||'UNKNOWN').toUpperCase();
    approvalModal.style.display='block';
    setState('waiting_confirmation','AUTHORIZATION');
  });
  socket.on('jarvis_reply_token',()=>{
    setState('speaking','RESPONDING');
  });
  socket.on('jarvis_reply',(data)=>{
    window.dispatchEvent(new CustomEvent('jarvis-reply',{detail:data||{}}));
    setState('speaking','RESPONDING');
    resetToIdle(2100);
  });

  const ctx=space.getContext('2d');
  const particles=Array.from({length:72},()=>({
    a:Math.random()*Math.PI*2,
    r:.16+Math.random()*.56,
    sp:(.00008+Math.random()*.00024)*(Math.random()>.5?1:-1),
    z:Math.random(),
    tw:Math.random()*Math.PI*2
  }));
  let sw=0,sh=0,ratio=1;
  const resize=()=>{
    ratio=Math.min(window.devicePixelRatio||1,2);
    sw=window.innerWidth; sh=window.innerHeight;
    space.width=Math.floor(sw*ratio); space.height=Math.floor(sh*ratio);
    space.style.width=sw+'px'; space.style.height=sh+'px';
    ctx.setTransform(ratio,0,0,ratio,0,0);
  };
  const drawSpace=(t)=>{
    ctx.clearRect(0,0,sw,sh);
    const cx=sw*.5,cy=sh*.48,max=Math.min(sw,sh)*.52;
    for(const p of particles){
      const ang=p.a+t*p.sp;
      const rr=max*p.r;
      const x=cx+Math.cos(ang)*rr;
      const y=cy+Math.sin(ang)*rr*.58;
      const pulse=.35+.35*Math.sin(t*.0012+p.tw);
      ctx.beginPath();
      ctx.fillStyle='rgba(133,231,255,'+(0.08+p.z*.23)*pulse+')';
      ctx.arc(x,y,.45+p.z*1.05,0,Math.PI*2);
      ctx.fill();
    }
    requestAnimationFrame(drawSpace);
  };
  resize(); window.addEventListener('resize',resize,{passive:true}); requestAnimationFrame(drawSpace);

  const cctx=coreCanvas.getContext('2d');
  let cw=1,ch=1,cr=1;
  const cp=Array.from({length:54},()=>({
    a:Math.random()*Math.PI*2,
    r:.17+Math.random()*.34,
    sp:(.0003+Math.random()*.0007)*(Math.random()>.5?1:-1),
    size:.4+Math.random()*1,
    warm:Math.random()<.11
  }));
  const resizeCore=()=>{
    const b=coreCanvas.getBoundingClientRect();
    cr=Math.min(window.devicePixelRatio||1,2);
    cw=Math.max(1,b.width); ch=Math.max(1,b.height);
    coreCanvas.width=Math.floor(cw*cr); coreCanvas.height=Math.floor(ch*cr);
    cctx.setTransform(cr,0,0,cr,0,0);
  };
  const drawCore=(t)=>{
    cctx.clearRect(0,0,cw,ch);
    const cx=cw*.5,cy=ch*.5,r=Math.min(cw,ch)*.42;
    cctx.globalCompositeOperation='lighter';
    const speed={idle:.65,listening:1.15,thinking:1.7,retrieving:1.5,searching:1.5,verifying:2,executing:2.25,speaking:1.0}[core.dataset.state]||.65;
    const pts=[];
    for(const p of cp){
      const a=p.a+t*p.sp*speed;
      const rr=r*p.r;
      const x=cx+Math.cos(a)*rr;
      const y=cy+Math.sin(a)*rr*.68;
      const alpha=.16+.22*(.5+.5*Math.sin(t*.0015+p.a));
      pts.push([x,y,alpha,p.warm]);
      cctx.beginPath();
      cctx.fillStyle=p.warm?'rgba(255,193,104,'+alpha*.78+')':'rgba(152,237,255,'+alpha+')';
      cctx.arc(x,y,p.size,0,Math.PI*2); cctx.fill();
    }
    for(let i=0;i<pts.length;i+=4){
      const a=pts[i],b=pts[(i*7+13)%pts.length];
      cctx.beginPath();
      cctx.strokeStyle='rgba(105,220,251,'+(Math.min(a[2],b[2])*.20)+')';
      cctx.lineWidth=.35;
      cctx.moveTo(a[0],a[1]);
      cctx.quadraticCurveTo(cx,cy,b[0],b[1]);
      cctx.stroke();
    }
    cctx.globalCompositeOperation='source-over';
    requestAnimationFrame(drawCore);
  };
  resizeCore(); window.addEventListener('resize',resizeCore,{passive:true}); requestAnimationFrame(drawCore);
})();
</script>
</body>
</html>
